name: Build APK and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Create necessary folders
        run: |
          mkdir -p app/src/main/java/com/example/islamicprayerwear/ui/screens
          mkdir -p app/src/main/java/com/example/islamicprayerwear/ui/components
          mkdir -p app/src/main/java/com/example/islamicprayerwear/ui/theme
          mkdir -p app/src/main/java/com/example/islamicprayerwear/data/model
          mkdir -p app/src/main/java/com/example/islamicprayerwear/data/repository
          mkdir -p app/src/main/java/com/example/islamicprayerwear/viewmodel
          mkdir -p app/src/main/java/com/example/islamicprayerwear/service
          mkdir -p app/src/main/java/com/example/islamicprayerwear/util
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/values-bn
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap
          mkdir -p app/src/test/java/com/example/islamicprayerwear
          mkdir -p app/src/androidTest/java/com/example/islamicprayerwear

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build APK (Debug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Build APK (Release)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v3
        with:
          name: apk-builds
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Islamic Prayer Pro - ${{ github.ref }}
          body: |
            ## Islamic Prayer Pro - Wear OS Edition
            
            ### Release Notes
            - Complete Wear OS Islamic Prayer App
            - Ring Timer Home Screen
            - 5 Daily Prayers with Islamic Foundation Bangladesh times
            - Tasbih Counter
            - Qibla Compass
            - Multi-timezone Support (BD, USA, Europe)
            - Bilingual (Bengali & English)
            
            ### Downloads
            - Debug APK: app-debug.apk
            - Release APK: app-release-unsigned.apk
            
            ### Build Status
            ✅ Build: Successful
            ✅ Tests: Passed
            ✅ Release: Ready
            
            ### Installation
            1. Download APK file
            2. Transfer to Wear OS device
            3. Install using ADB: adb install app-debug.apk
            
            ### Supported Devices
            - Galaxy Watch 6 Classic (43mm, 47mm)
            - All Round Wear OS 3.0+ Watches
            
            ---
            Built with ❤️ for Muslims worldwide
          draft: false
          prerelease: false

      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./app/build/outputs/apk/debug/app-debug.apk
          asset_name: Islamic-Prayer-Pro-debug.apk
          asset_content_type: application/vnd.android.package-archive

      - name: Build Report
        if: always()
        run: |
          echo "=== Build Summary ===" 
          echo "Build Status: ${{ job.status }}"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          ls -la app/build/outputs/apk/ || echo "No APK outputs found"
