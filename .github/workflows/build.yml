name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup folders and files
        run: |
          mkdir -p app/src/main/{java/com/example/islamicprayerwear/{ui/{screens,components,theme},data/{model,repository},viewmodel,service,util},res/{values,values-bn,drawable,mipmap}}
          mkdir -p app/src/{test,androidTest}/java/com/example/islamicprayerwear
          
          cat > build.gradle.kts << 'GRADLE'
          plugins {
              id("com.android.application") version "8.2.0"
              id("org.jetbrains.kotlin.android") version "2.0.0"
          }
          android {
              namespace = "com.example.islamicprayerwear"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.example.islamicprayerwear"
                  minSdk = 30
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0.0"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(getDefaultProguardFile("proguard-android.txt"))
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.15"
              }
          }
          dependencies {
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.wear:wear:1.3.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.6")
              implementation("androidx.activity:activity-compose:1.9.2")
              testImplementation("junit:junit:4.13.2")
          }
          GRADLE

          cat > settings.gradle.kts << 'SETTINGS'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          include(":app")
          SETTINGS

          cat > gradle.properties << 'PROPS'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          kotlin.code.style=official
          PROPS

          cat > app/proguard-rules.pro << 'PROGUARD'
          -keep class androidx.** { *; }
          -dontwarn androidx.**
          PROGUARD

          cat > app/src/main/AndroidManifest.xml << 'MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-feature android:name="android.hardware.type.watch" />
              <application android:label="@string/app_name">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          ategory android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST

          cat > app/src/main/java/com/example/islamicprayerwear/MainActivity.kt << 'KOTLIN'
          package com.example.islamicprayerwear
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
              }
          }
          KOTLIN

          cat > app/src/main/res/values/strings.xml << 'STRINGS'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Islamic Prayer Pro</string>
          </resources>
          STRINGS

          cat > app/src/main/res/values-bn/strings.xml << 'STRINGS_BN'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">ইসলামিক প্রেয়ার প্রো</string>
          </resources>
          STRINGS_BN

      - name: Build APK
        run: |
          chmod +x ./gradlew || gradle wrapper
          ./gradlew assembleDebug || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-builds
          path: app/build/outputs/apk/*/*.apk
          if-no-files-found: ignore
